# Add inside the td-dev.demonreeper.xyz server block (the one listening on 443).
# /tiles/{z}/{x}/{y}.png  ->  TileServer GL's /styles/terran/{z}/{x}/{y}.png  (@2x for 512 px)
location /tiles/ {
    proxy_pass http://127.0.0.1:8095/styles/terran/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    # Tiles change only when the map data or style is redeployed; let phones and Cloudflare cache them.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800";
}
